[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/indexer",
    "crates/xdr-parser",
    "crates/domain",
    "crates/backfill-runner",
    "crates/enrichment-shared",
    "crates/enrichment-worker",
    "crates/backfill-enrichment-runner",
    "crates/db-clickhouse",
    "crates/load-tests",
]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Web framework + Lambda
axum = "0.8"
lambda_http = "1"
lambda_runtime = "1"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

# Database
clickhouse = "=0.15.0"

# Stellar XDR
stellar-xdr = { version = "27" }

# Encoding
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"

# Compression
zstd = "0.13"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# AWS SDK
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-cloudwatch = "1"
aws-sdk-s3 = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-sqs = "1"

# Error handling
thiserror = "2"

# HTTP client (api crate: SEP-1
# stellar.toml fetches per task 0188). rustls-tls + json features only —
# no native-tls so the build stays small and reproducible across Lambda /
# CI / local without OpenSSL system deps.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# TOML parsing (SEP-1 stellar.toml files per task 0188).
toml = "0.8"
