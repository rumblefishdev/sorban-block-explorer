[package]
name = "db-clickhouse"
version = "0.1.0"
edition = "2024"
description = "ClickHouse pilot — connection layer + schema apply CLI for the parallel store (ADR 0044, task 0204)"

[[bin]]
name = "db-clickhouse-init"
path = "src/bin/db-clickhouse-init.rs"

[features]
default = []
# Exposes the `mtls` module — builds a `clickhouse::Client` that
# authenticates to a remote CH endpoint (Caddy reverse proxy on the
# Hetzner box, task 0240) with a client cert bundle fetched from AWS
# Secrets Manager via the Parameters and Secrets Lambda Extension
# (localhost:2773). Used by the indexer Lambda after the PG → CH hard
# swap (task 0241); the same builder is the foreseen entry point for
# the api / migration / partition / enrichment Lambdas once their
# read-path migrations land.
aws-mtls = [
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:rustls-pki-types",
    "dep:webpki-roots",
    "dep:reqwest",
]

[dependencies]
# Official ClickHouse Inc.-maintained client (resolves ADR 0044 §Decision §5
# Q4). Version pinned in workspace.dependencies (root Cargo.toml) so api,
# indexer, backfill-runner, and this crate stay in lockstep.
clickhouse = { workspace = true }
# Shared Extracted* types — the CH writer consumes the same parser surface
# the PG persist path does, with the documented `soroban_events` unfold
# (ADR 0044 §Decision §4a). Domain enums supply the i16 discriminants used
# in CH SMALLINT columns.
xdr-parser = { path = "../xdr-parser" }
stellar-strkey = "0.0.16"
domain = { path = "../domain" }
# Already pulled in transitively by `clickhouse` (lz4/zstd features).
# Declared directly so `db_clickhouse::persist::ids` can derive
# surrogate Int64 IDs on the three high-cardinality FK hubs
# (accounts, soroban_contracts, transactions) — see ids.rs.
cityhash-rs = "1.0.1"
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

# mTLS feature dependencies (gated by `aws-mtls`). Kept optional so the
# `db-clickhouse-init` CLI (local dev / CI schema-apply) does not pull
# the rustls / hyper-util stack — that binary talks to plain HTTP CH on
# loopback and has no need for client cert plumbing.
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"], optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "aws-lc-rs"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
rustls-pki-types = { version = "1", optional = true }
# Mozilla WebPKI roots — the CLIENT trust store used to verify the *server's*
# certificate during the TLS handshake. Caddy fronts ClickHouse with a
# Let's Encrypt cert (chains to a public root), so the client must trust the
# public WebPKI. The mTLS bundle's `ca_pem` signs the *client* cert (Caddy
# verifies that server-side) and is NOT a server-cert root — see
# `mtls.rs::client_with_mtls`. Version 1.x matches `rustls-pki-types` 1.x
# (`TLS_SERVER_ROOTS` yields `rustls_pki_types::TrustAnchor`).
webpki-roots = { version = "1", optional = true }
# Reused from the workspace `reqwest` (already rustls-tls). Used solely
# for the localhost:2773 GET against the Secrets Manager Lambda Extension
# — small surface (one async HTTP call), so we avoid pulling another
# HTTP client.
reqwest = { workspace = true, optional = true }

[dev-dependencies]
# Build raw `ScVal` METADATA fixtures in the live-CH metadata e2e so the test
# exercises the full chain (parse → build_rows → write → read), not just write.
stellar-xdr = { workspace = true }
# Decode captured real-mainnet `resultMetaXdr` fixtures in the net-settled e2e.
base64 = { workspace = true }
